<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Semitones make a world of difference</title>
    <style>
        :root {
            --church: #f28f4e;
            --melmin: #f6ce5b;
            --exotic: #c9c2d3;
            --ink-dark: #2b2034;
            --ink-light: #fbf2e8;
            --grid: rgba(120, 108, 140, 0.14);
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        /* Bright modes up top, dark modes at the bottom, on a fine grid. */
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background:
                linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
                linear-gradient(to bottom, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
                linear-gradient(to bottom, #fbe5bf 0%, #f3b98c 28%, #d17d88 52%, #6f4c8b 76%, #251e42 100%);
            background-attachment: fixed;
        }

        /* Toward the left and right fringes, where the scales get exotic, the colors fade out. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            backdrop-filter: saturate(0.1);
            -webkit-backdrop-filter: saturate(0.1);
            mask-image: linear-gradient(to right, black, transparent 38%, transparent 62%, black);
            -webkit-mask-image: linear-gradient(to right, black, transparent 38%, transparent 62%, black);
        }

        main {
            position: relative;
            width: 100%;
            height: 100%;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Each mode is a pill in its family's color; hovering lifts it to show it can be played. */
        .mode {
            cursor: pointer;
        }

        .mode rect {
            fill-opacity: 0.88;
            stroke: rgba(30, 20, 40, 0.18);
            filter: drop-shadow(0 2px 4px rgba(20, 10, 30, 0.18));
            transition: filter 0.15s;
        }

        .mode:hover rect {
            filter: drop-shadow(0 4px 10px rgba(20, 10, 30, 0.3)) brightness(1.06);
        }

        .mode.playing rect {
            stroke: #fff;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.85));
        }

        .mode text {
            fill: var(--ink-dark);
            font-weight: 650;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .church rect { fill: var(--church); }
        .melmin rect { fill: var(--melmin); }
        .exotic rect { fill: var(--exotic); }

        /* The steps between modes: just what changes, in the direction it goes,
           on a faint pill that switches with the ink where the background turns dark. */
        .step {
            pointer-events: none;
        }

        .step text {
            font-size: 13px;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .step.dark rect { fill: rgba(255, 248, 240, 0.4); }
        .step.dark text { fill: var(--ink-dark); }
        .step.light rect { fill: rgba(25, 18, 40, 0.4); }
        .step.light text { fill: var(--ink-light); }

        .legend {
            position: absolute;
            right: 24px;
            bottom: 24px;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(20, 14, 34, 0.45);
            backdrop-filter: blur(6px);
            color: var(--ink-light);
            font-size: 14px;
        }

        .legend h2 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        @media (max-width: 700px), (max-height: 500px) {
            .legend {
                right: 12px;
                bottom: 12px;
                padding: 10px 12px;
                font-size: 12px;
            }
        }

        .legend div {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        .legend span {
            width: 22px;
            height: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <main>
        <svg id="graph" viewBox="0 0 1600 1000"></svg>
        <div class="legend">
            <h2>Legend</h2>
            <div><span style="background: var(--church)"></span>"Church" Modes of Major scale</div>
            <div><span style="background: var(--melmin)"></span>Modes of Melodic Minor</div>
            <div><span style="background: var(--exotic)"></span>Exotic/Theoretical Modes</div>
        </div>
    </main>
    <script>
        // [audio file name, label, x %, y %, kind]
        const nodes = [
            ["MixolydianSharp5Sharp11", "Mixo #5 #11",      15, 10, "exotic"],
            ["LydianSharp5",            "Lydian#5",         35, 10, "melmin"],
            ["Lydian",                  "Lydian",           45, 20, "church"],
            ["MixolydianSharp11Flat13", "Mixo #11 b13",     15, 30, "exotic"],
            ["MixolydianSharp11",       "Mixo #11",         35, 30, "melmin"],
            ["Ionian",                  "Ionian",           55, 30, "church"],
            ["Mixolydian",              "Mixolydian",       45, 40, "church"],
            ["MelodicMinor",            "Melodic Minor",    65, 40, "melmin"],
            ["MelodicMinorFlat9",       "MelMin b9",        85, 40, "exotic"],
            ["MixolydianFlat5Flat13",   "Mixo b5 b13",      15, 50, "exotic"],
            ["MixolydianFlat13",        "Mixo b13",         35, 50, "melmin"],
            ["Dorian",                  "Dorian",           55, 50, "church"],
            ["Aeolian",                 "Aeolian",          45, 60, "church"],
            ["DorianFlat9",             "Dorian b9",        65, 60, "melmin"],
            ["DorianFlat8Flat9",        "Dorian b9 b8",     85, 60, "exotic"],
            ["LocrianNat9Flat4",        "Locrian9b4",       15, 70, "exotic"],
            ["LocrianNat9",             "Locrian nat9",     35, 70, "melmin"],
            ["Phrygian",                "Phrygian",         55, 70, "church"],
            ["Locrian",                 "Locrian",          45, 80, "church"],
            ["AlteredFlat9Nat9",        "Altered b9 nat9",  15, 90, "exotic"],
            ["Altered",                 "Altered",          35, 90, "melmin"],
        ];

        // [from, to, label]: lowering one note of `from` gives `to`
        const edges = [
            ["LydianSharp5",      "MixolydianSharp5Sharp11", "lower 7"],
            ["MixolydianSharp11", "MixolydianSharp11Flat13", "lower 6"],
            ["MixolydianFlat13",  "MixolydianFlat5Flat13",   "lower 5"],
            ["LocrianNat9",       "LocrianNat9Flat4",        "lower 4"],
            ["Altered",           "AlteredFlat9Nat9",        "lower 3"],
            ["LydianSharp5",      "Lydian",                  "lower #5"],
            ["MixolydianSharp11", "Mixolydian",              "lower #4"],
            ["MixolydianFlat13",  "Aeolian",                 "lower 3"],
            ["LocrianNat9",       "Locrian",                 "lower 9"],
            ["Lydian",            "MixolydianSharp11",       "lower 7"],
            ["Mixolydian",        "MixolydianFlat13",        "lower 6"],
            ["Aeolian",           "LocrianNat9",             "lower 5"],
            ["Locrian",           "Altered",                 "lower 4"],
            ["Lydian",            "Ionian",                  "lower #11"],
            ["Mixolydian",        "Dorian",                  "lower 3"],
            ["Aeolian",           "Phrygian",                "lower 2"],
            ["Ionian",            "Mixolydian",              "lower 7"],
            ["Dorian",            "Aeolian",                 "lower 6"],
            ["Phrygian",          "Locrian",                 "lower 5"],
            ["Ionian",            "MelodicMinor",            "lower 3"],
            ["Dorian",            "DorianFlat9",             "lower 2"],
            ["MelodicMinor",      "Dorian",                  "lower 7"],
            ["DorianFlat9",       "Phrygian",                "lower 6"],
            ["MelodicMinor",      "MelodicMinorFlat9",       "lower 2"],
            ["DorianFlat9",       "DorianFlat8Flat9",        "lower 1"],
        ];

        const svg = document.getElementById("graph");
        const w = 1600, h = 1000; // fixed drawing size, scaled to fit the screen
        let playing = null;

        function draw() {
            // Where the drawing ends up on screen, to match the step ink to the background.
            const box = svg.getBoundingClientRect();
            const scale = Math.min(box.width / w, box.height / h);
            const top = box.top + (box.height - h * scale) / 2;
            const ink = y => top + y * scale < 0.62 * innerHeight ? "dark" : "light";
            const pos = {};
            for (const [id, , x, y] of nodes) pos[id] = [x / 100 * w, y / 100 * h];

            let out = "";
            for (const [from, to, label] of edges) {
                const [x1, y1] = pos[from], [x2, y2] = pos[to];
                const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
                // Text follows the step's direction but never reads upside down.
                const leftward = x2 < x1;
                const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI + (leftward ? 180 : 0);
                const text = leftward ? `\u2190 ${label}` : `${label} \u2192`;
                out += `<g class="step ${ink(my)}" transform="translate(${mx},${my}) rotate(${angle})">
                    <rect/><text>${text}</text>
                </g>`;
            }

            for (const [id, label, , , kind] of nodes) {
                const [x, y] = pos[id];
                out += `<g class="mode ${kind}${id === playing ? " playing" : ""}"
                    transform="translate(${x},${y})" onclick="play('${id}')">
                    <rect/><text font-size="22">${label}</text>
                </g>`;
            }
            svg.innerHTML = out;

            // Wrap each label in a pill that fits its text.
            for (const g of svg.querySelectorAll(".mode, .step")) {
                const t = g.querySelector("text").getBBox();
                const [px, py] = g.classList.contains("mode") ? [18, 9] : [7, 2];
                const height = t.height + 2 * py;
                Object.entries({ x: t.x - px, y: t.y - py, width: t.width + 2 * px, height, rx: height / 2 })
                    .forEach(([k, v]) => g.querySelector("rect").setAttribute(k, v));
            }
        }

        function play(id) {
            // Skip if audio is currently playing
            if (playing) {
                return;
            }
            // Otherwise start playing, setting the guard
            const audio = new Audio("./scales/audio/" + id + ".mp3");
            audio.onplaying = () => { playing = id; draw(); };
            audio.onended = () => { playing = null; draw(); };
            audio.play();
        }

        draw();
        addEventListener("resize", draw);
    </script>
</body>
</html>
