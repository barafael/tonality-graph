<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Semitones make a world of difference</title>
    <style>
        :root {
            --church: #f28f4e;
            --melmin: #f6ce5b;
            --exotic: #c9c2d3;
            --ink-dark: #2b2034;
            --ink-light: #fbf2e8;
            --grid: rgba(120, 108, 140, 0.14);
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        /* Bright modes up top, dark modes at the bottom, on a fine grid. */
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background:
                linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
                linear-gradient(to bottom, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
                linear-gradient(to bottom, #fbe5bf 0%, #f3b98c 28%, #d17d88 52%, #6f4c8b 76%, #251e42 100%);
            background-attachment: fixed;
        }

        main {
            position: relative;
            width: 100%;
            height: 100%;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .node {
            cursor: pointer;
        }

        .node circle {
            stroke: rgba(30, 20, 40, 0.55);
            stroke-width: 1.5;
            filter: drop-shadow(0 3px 6px rgba(20, 10, 30, 0.25));
            transition: filter 0.15s, stroke 0.15s, stroke-width 0.15s;
        }

        .node:hover circle {
            filter: drop-shadow(0 3px 6px rgba(20, 10, 30, 0.25)) brightness(1.08);
        }

        .node.playing circle {
            stroke: #fff;
            stroke-width: 3;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        }

        .node text {
            fill: var(--ink-dark);
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }

        .church circle { fill: var(--church); }
        .melmin circle { fill: var(--melmin); }
        .exotic circle { fill: var(--exotic); }

        /* Edges and their labels switch ink where the background turns dark. */
        .edge line { stroke-width: 2; }
        .edge text { text-anchor: middle; dominant-baseline: central; }
        .edge.dark line { stroke: var(--ink-dark); }
        .edge.dark polygon, .edge.dark text { fill: var(--ink-dark); }
        .edge.light line { stroke: var(--ink-light); }
        .edge.light polygon, .edge.light text { fill: var(--ink-light); }

        .legend {
            position: absolute;
            right: 24px;
            bottom: 24px;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(20, 14, 34, 0.45);
            backdrop-filter: blur(6px);
            color: var(--ink-light);
            font-size: 14px;
        }

        .legend h2 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        @media (max-width: 700px), (max-height: 500px) {
            .legend {
                right: 12px;
                bottom: 12px;
                padding: 10px 12px;
                font-size: 12px;
            }
        }

        .legend div {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        .legend span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(30, 20, 40, 0.55);
        }
    </style>
</head>
<body>
    <main>
        <svg id="graph" viewBox="0 0 1600 1000"></svg>
        <div class="legend">
            <h2>Legend</h2>
            <div><span style="background: var(--church)"></span>"Church" Modes of Major scale</div>
            <div><span style="background: var(--melmin)"></span>Modes of Melodic Minor</div>
            <div><span style="background: var(--exotic)"></span>Exotic/Theoretical Modes</div>
        </div>
    </main>
    <script>
        // [audio file name, label (\n breaks lines), x %, y %, kind]
        const nodes = [
            ["MixolydianSharp5Sharp11", "Mixo\n#5 #11",        15, 10, "exotic"],
            ["LydianSharp5",            "Lydian#5",            35, 10, "melmin"],
            ["Lydian",                  "Lydian",              45, 20, "church"],
            ["MixolydianSharp11Flat13", "Mixo\n#11 b13",       15, 30, "exotic"],
            ["MixolydianSharp11",       "Mixo #11",            35, 30, "melmin"],
            ["Ionian",                  "Ionian",              55, 30, "church"],
            ["Mixolydian",              "Mixolydian",          45, 40, "church"],
            ["MelodicMinor",            "Melodic\nMinor",      65, 40, "melmin"],
            ["MelodicMinorFlat9",       "MelMin b9",           85, 40, "exotic"],
            ["MixolydianFlat5Flat13",   "Mixo\nb5 b13",        15, 50, "exotic"],
            ["MixolydianFlat13",        "Mixo b13",            35, 50, "melmin"],
            ["Dorian",                  "Dorian",              55, 50, "church"],
            ["Aeolian",                 "Aeolian",             45, 60, "church"],
            ["DorianFlat9",             "Dorian b9",           65, 60, "melmin"],
            ["DorianFlat8Flat9",        "Dorian\nb9 b8",       85, 60, "exotic"],
            ["LocrianNat9Flat4",        "Locrian9b4",          15, 70, "exotic"],
            ["LocrianNat9",             "Locrian\nnat9",       35, 70, "melmin"],
            ["Phrygian",                "Phrygian",            55, 70, "church"],
            ["Locrian",                 "Locrian",             45, 80, "church"],
            ["AlteredFlat9Nat9",        "Altered\nb9 nat9",    15, 90, "exotic"],
            ["Altered",                 "Altered",             35, 90, "melmin"],
        ];

        // [from, to, label]: lowering one note of `from` gives `to`
        const edges = [
            ["LydianSharp5",      "MixolydianSharp5Sharp11", "lower 7"],
            ["MixolydianSharp11", "MixolydianSharp11Flat13", "lower 6"],
            ["MixolydianFlat13",  "MixolydianFlat5Flat13",   "lower 5"],
            ["LocrianNat9",       "LocrianNat9Flat4",        "lower 4"],
            ["Altered",           "AlteredFlat9Nat9",        "lower 3"],
            ["LydianSharp5",      "Lydian",                  "lower #5"],
            ["MixolydianSharp11", "Mixolydian",              "lower #4"],
            ["MixolydianFlat13",  "Aeolian",                 "lower 3"],
            ["LocrianNat9",       "Locrian",                 "lower 9"],
            ["Lydian",            "MixolydianSharp11",       "lower 7"],
            ["Mixolydian",        "MixolydianFlat13",        "lower 6"],
            ["Aeolian",           "LocrianNat9",             "lower 5"],
            ["Locrian",           "Altered",                 "lower 4"],
            ["Lydian",            "Ionian",                  "lower #11"],
            ["Mixolydian",        "Dorian",                  "lower 3"],
            ["Aeolian",           "Phrygian",                "lower 2"],
            ["Ionian",            "Mixolydian",              "lower 7"],
            ["Dorian",            "Aeolian",                 "lower 6"],
            ["Phrygian",          "Locrian",                 "lower 5"],
            ["Ionian",            "MelodicMinor",            "lower 3"],
            ["Dorian",            "DorianFlat9",             "lower 2"],
            ["MelodicMinor",      "Dorian",                  "lower 7"],
            ["DorianFlat9",       "Phrygian",                "lower 6"],
            ["MelodicMinor",      "MelodicMinorFlat9",       "lower 2"],
            ["DorianFlat9",       "DorianFlat8Flat9",        "lower 1"],
        ];

        const svg = document.getElementById("graph");
        const w = 1600, h = 1000; // fixed drawing size, scaled to fit the screen
        let playing = null;

        function draw() {
            // Where the drawing ends up on screen, to match the ink to the background.
            const box = svg.getBoundingClientRect();
            const scale = Math.min(box.width / w, box.height / h);
            const top = box.top + (box.height - h * scale) / 2;
            const r = 0.04 * Math.hypot(w, h) / Math.SQRT2;
            const nodeFont = Math.max(11, Math.min(17, r * 0.28));
            const edgeFont = Math.max(10, nodeFont * 0.8);
            const pos = {};
            for (const [id, , x, y] of nodes) pos[id] = [x / 100 * w, y / 100 * h];

            let out = "";
            for (const [from, to, label] of edges) {
                const [x1, y1] = pos[from], [x2, y2] = pos[to];
                const len = Math.hypot(x2 - x1, y2 - y1);
                const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
                const gap = r + 6, head = 11;
                const sx = x1 + ux * gap, sy = y1 + uy * gap;       // line start
                const tx = x2 - ux * gap, ty = y2 - uy * gap;       // arrow tip
                const bx = tx - ux * head, by = ty - uy * head;     // arrow base
                // Label sits beside the edge's midpoint, on the upper side.
                const [nx, ny] = uy > 0 ? [uy * Math.sign(ux), -Math.abs(ux)] : [0, -1];
                const d = edgeFont / 2 + Math.abs(nx) * label.length * edgeFont * 0.28 + 5;
                const lx = (sx + tx) / 2 + nx * d, ly = (sy + ty) / 2 + ny * d;
                const ink = top + (y1 + y2) / 2 * scale < 0.62 * innerHeight ? "dark" : "light";
                out += `<g class="edge ${ink}">
                    <line x1="${sx}" y1="${sy}" x2="${bx}" y2="${by}"/>
                    <polygon points="${tx},${ty} ${bx - uy * 5},${by + ux * 5} ${bx + uy * 5},${by - ux * 5}"/>
                    <text x="${lx}" y="${ly}" font-size="${edgeFont}">${label}</text>
                </g>`;
            }

            for (const [id, label, , , kind] of nodes) {
                const [x, y] = pos[id];
                const lines = label.split("\n");
                const longest = Math.max(...lines.map(line => line.length));
                const font = Math.min(nodeFont, 1.75 * r / (longest * 0.62));
                const tspans = lines.map((line, i) =>
                    `<tspan x="0" y="${(i - (lines.length - 1) / 2) * font * 1.15}">${line}</tspan>`).join("");
                out += `<g class="node ${kind}${id === playing ? " playing" : ""}" transform="translate(${x},${y})" onclick="play('${id}')">
                    <circle r="${r}"/>
                    <text font-size="${font}">${tspans}</text>
                </g>`;
            }
            svg.innerHTML = out;
        }

        function play(id) {
            // Skip if audio is currently playing
            if (playing) {
                return;
            }
            // Otherwise start playing, setting the guard
            const audio = new Audio("./scales/audio/" + id + ".mp3");
            audio.onplaying = () => { playing = id; draw(); };
            audio.onended = () => { playing = null; draw(); };
            audio.play();
        }

        draw();
        addEventListener("resize", draw);
    </script>
</body>
</html>
