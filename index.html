<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Semitones make a world of difference</title>
    <style>
        :root {
            --church: #f28f4e;
            --melmin: #f6ce5b;
            --exotic: #c9c2d3;
            --ink-dark: #2b2034;
            --ink-light: #fbf2e8;
            --grid: rgba(120, 108, 140, 0.14);
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        /* Bright modes up top, dark modes at the bottom, on a fine grid. */
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background:
                linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
                linear-gradient(to bottom, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
                linear-gradient(to bottom, #fbe5bf 0%, #f3b98c 28%, #d17d88 52%, #6f4c8b 76%, #251e42 100%);
            background-attachment: fixed;
        }

        /* Toward the left and right fringes, where the scales get exotic, the colors fade out. */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            backdrop-filter: saturate(0.1);
            -webkit-backdrop-filter: saturate(0.1);
            mask-image: linear-gradient(to right, black, transparent 38%, transparent 62%, black);
            -webkit-mask-image: linear-gradient(to right, black, transparent 38%, transparent 62%, black);
        }

        main {
            position: relative;
            width: 100%;
            height: 100%;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Each mode is a tile. Tiles that share a border are one step apart. */
        .mode {
            cursor: pointer;
        }

        .mode polygon {
            fill-opacity: 0.8;
            transition: filter 0.15s;
        }

        .mode:hover polygon {
            filter: brightness(1.08) drop-shadow(0 4px 10px rgba(20, 10, 30, 0.3));
        }

        .mode.playing polygon {
            stroke: #fff;
            stroke-width: 3;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.8));
        }

        .mode text {
            fill: var(--ink-dark);
            font-weight: 650;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .church polygon { fill: var(--church); }
        .melmin polygon { fill: var(--melmin); }
        .exotic polygon { fill: var(--exotic); fill-opacity: 0.6; }

        /* The steps sit on the borders between tiles, as small badges. */
        .step {
            pointer-events: none;
        }

        .step rect {
            fill: rgba(30, 20, 45, 0.78);
        }

        .step text {
            fill: var(--ink-light);
            font-size: 13px;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .legend {
            position: absolute;
            right: 24px;
            bottom: 24px;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(20, 14, 34, 0.45);
            backdrop-filter: blur(6px);
            color: var(--ink-light);
            font-size: 14px;
        }

        .legend h2 {
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        @media (max-width: 700px), (max-height: 500px) {
            .legend {
                right: 12px;
                bottom: 12px;
                padding: 10px 12px;
                font-size: 12px;
            }
        }

        .legend div {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        .legend span {
            width: 22px;
            height: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <main>
        <svg id="graph" viewBox="0 0 1600 1000"></svg>
        <div class="legend">
            <h2>Legend</h2>
            <div><span style="background: var(--church)"></span>"Church" Modes of Major scale</div>
            <div><span style="background: var(--melmin)"></span>Modes of Melodic Minor</div>
            <div><span style="background: var(--exotic)"></span>Exotic/Theoretical Modes</div>
        </div>
    </main>
    <script>
        // [audio file name, label, x %, y %, kind]
        const nodes = [
            ["MixolydianSharp5Sharp11", "Mixo #5 #11",      15, 10, "exotic"],
            ["LydianSharp5",            "Lydian#5",         35, 10, "melmin"],
            ["Lydian",                  "Lydian",           45, 20, "church"],
            ["MixolydianSharp11Flat13", "Mixo #11 b13",     15, 30, "exotic"],
            ["MixolydianSharp11",       "Mixo #11",         35, 30, "melmin"],
            ["Ionian",                  "Ionian",           55, 30, "church"],
            ["Mixolydian",              "Mixolydian",       45, 40, "church"],
            ["MelodicMinor",            "Melodic Minor",    65, 40, "melmin"],
            ["MelodicMinorFlat9",       "MelMin b9",        85, 40, "exotic"],
            ["MixolydianFlat5Flat13",   "Mixo b5 b13",      15, 50, "exotic"],
            ["MixolydianFlat13",        "Mixo b13",         35, 50, "melmin"],
            ["Dorian",                  "Dorian",           55, 50, "church"],
            ["Aeolian",                 "Aeolian",          45, 60, "church"],
            ["DorianFlat9",             "Dorian b9",        65, 60, "melmin"],
            ["DorianFlat8Flat9",        "Dorian b9 b8",     85, 60, "exotic"],
            ["LocrianNat9Flat4",        "Locrian9b4",       15, 70, "exotic"],
            ["LocrianNat9",             "Locrian nat9",     35, 70, "melmin"],
            ["Phrygian",                "Phrygian",         55, 70, "church"],
            ["Locrian",                 "Locrian",          45, 80, "church"],
            ["AlteredFlat9Nat9",        "Altered b9 nat9",  15, 90, "exotic"],
            ["Altered",                 "Altered",          35, 90, "melmin"],
        ];

        // [from, to, label]: lowering one note of `from` gives `to`
        const edges = [
            ["LydianSharp5",      "MixolydianSharp5Sharp11", "lower 7"],
            ["MixolydianSharp11", "MixolydianSharp11Flat13", "lower 6"],
            ["MixolydianFlat13",  "MixolydianFlat5Flat13",   "lower 5"],
            ["LocrianNat9",       "LocrianNat9Flat4",        "lower 4"],
            ["Altered",           "AlteredFlat9Nat9",        "lower 3"],
            ["LydianSharp5",      "Lydian",                  "lower #5"],
            ["MixolydianSharp11", "Mixolydian",              "lower #4"],
            ["MixolydianFlat13",  "Aeolian",                 "lower 3"],
            ["LocrianNat9",       "Locrian",                 "lower 9"],
            ["Lydian",            "MixolydianSharp11",       "lower 7"],
            ["Mixolydian",        "MixolydianFlat13",        "lower 6"],
            ["Aeolian",           "LocrianNat9",             "lower 5"],
            ["Locrian",           "Altered",                 "lower 4"],
            ["Lydian",            "Ionian",                  "lower #11"],
            ["Mixolydian",        "Dorian",                  "lower 3"],
            ["Aeolian",           "Phrygian",                "lower 2"],
            ["Ionian",            "Mixolydian",              "lower 7"],
            ["Dorian",            "Aeolian",                 "lower 6"],
            ["Phrygian",          "Locrian",                 "lower 5"],
            ["Ionian",            "MelodicMinor",            "lower 3"],
            ["Dorian",            "DorianFlat9",             "lower 2"],
            ["MelodicMinor",      "Dorian",                  "lower 7"],
            ["DorianFlat9",       "Phrygian",                "lower 6"],
            ["MelodicMinor",      "MelodicMinorFlat9",       "lower 2"],
            ["DorianFlat9",       "DorianFlat8Flat9",        "lower 1"],
        ];

        const svg = document.getElementById("graph");
        const w = 1600, h = 1000; // fixed drawing size, scaled to fit the screen
        let playing = null;

        // Shrink a polygon by d on every side, leaving a thin gap between tiles.
        function inset(points, d) {
            const n = points.length;
            const area = points.reduce((sum, [x1, y1], i) => {
                const [x2, y2] = points[(i + 1) % n];
                return sum + x1 * y2 - x2 * y1;
            }, 0);
            const lines = points.map(([x1, y1], i) => {
                const [x2, y2] = points[(i + 1) % n];
                const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) * Math.sign(area);
                return [x1 - dy / len * d, y1 + dx / len * d, dx, dy];
            });
            return lines.map(([x, y, dx, dy], i) => {
                const [px, py, pdx, pdy] = lines[(i + n - 1) % n];
                const t = ((x - px) * dy - (y - py) * dx) / (pdx * dy - pdy * dx);
                return [px + pdx * t, py + pdy * t];
            });
        }

        function draw() {
            const pos = {};
            for (const [id, , x, y] of nodes) pos[id] = [x / 100 * w, y / 100 * h];
            // Neighbors are a diagonal step apart, so diamonds of this size tile the lattice.
            const a = 0.1 * w, b = 0.1 * h;

            let out = "";
            for (const [id, label, , , kind] of nodes) {
                const [x, y] = pos[id];
                let tile;
                if (kind !== "exotic") {
                    tile = [[x, y - b], [x + a, y], [x, y + b], [x - a, y]];
                } else {
                    // Fringe modes are flags that fit against their neighbor's diamond and taper
                    // outward, so fringe flags above and below each other only meet at a corner.
                    const side = x < w / 2 ? -1 : 1, cx = x - 2 * a * side, ox = x + 0.12 * w * side;
                    tile = [[cx, y - b], [ox, y - 0.45 * b], [ox, y + 0.45 * b], [cx, y + b], [cx + a * side, y]];
                }
                const points = inset(tile, 4).map(p => p.join(",")).join(" ");
                out += `<g class="mode ${kind}${id === playing ? " playing" : ""}" onclick="play('${id}')">
                    <polygon points="${points}"/>
                    <text x="${x}" y="${y}" font-size="21">${label}</text>
                </g>`;
            }

            const arrows = { "1,0": "\u2192", "-1,0": "\u2190", "1,1": "\u2198", "-1,1": "\u2199" };
            for (const [from, to, label] of edges) {
                const [x1, y1] = pos[from], [x2, y2] = pos[to];
                const arrow = arrows[[Math.sign(x2 - x1), Math.sign(y2 - y1)]];
                const text = x2 < x1 ? `${arrow} ${label}` : `${label} ${arrow}`;
                out += `<g class="step" transform="translate(${(x1 + x2) / 2},${(y1 + y2) / 2})">
                    <rect/><text>${text}</text>
                </g>`;
            }
            svg.innerHTML = out;

            // Fit each step badge to its text.
            for (const g of svg.querySelectorAll(".step")) {
                const t = g.querySelector("text").getBBox();
                const height = t.height + 4;
                Object.entries({ x: t.x - 7, y: t.y - 2, width: t.width + 14, height, rx: height / 2 })
                    .forEach(([k, v]) => g.querySelector("rect").setAttribute(k, v));
            }
        }

        function play(id) {
            // Skip if audio is currently playing
            if (playing) {
                return;
            }
            // Otherwise start playing, setting the guard
            const audio = new Audio("./scales/audio/" + id + ".mp3");
            audio.onplaying = () => { playing = id; draw(); };
            audio.onended = () => { playing = null; draw(); };
            audio.play();
        }

        draw();
        addEventListener("resize", draw);
    </script>
</body>
</html>
